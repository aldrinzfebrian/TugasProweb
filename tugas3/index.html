<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator-container">
        <div class="input-group">
            <label for="bil1">Input Bilangan 1</label>
            <input type="number" id="bil1" placeholder="Masukkan angka pertama">
        </div>

        <div class="input-group">
            <label for="bil2">Input Bilangan 2</label>
            <input type="number" id="bil2" placeholder="Masukkan angka kedua">
        </div>

        <div class="button-group">
            <button onclick="hitung('+')">+</button>
            <button onclick="hitung('-')">-</button>
            <button onclick="hitung('*')">x</button>
            <button onclick="hitung('/')">/</button>
        </div>

        <div class="input-group">
            <label for="output">Output</label>
            <input type="text" id="output" readonly placeholder="Hasil">
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
